name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic checks. No API key needed.
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.3

      - name: Byte-compile all modules
        run: python -m compileall -q .

      # ruff.toml uses preview docstring rules, which can change between releases, so ruff is pinned.
      - name: Lint
        run: ruff check . --output-format=github

      # Runs even if lint failed, so a lint problem never hides the test results.
      - name: Run pytest
        if: ${{ !cancelled() }}
        run: python -m pytest -v

  # Full-project evaluation by Claude Code in headless (-p) mode.
  claude-evaluation:
    name: Claude project evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs on pull requests and manual dispatch only (not on every push, to control API cost).
    # Fork PRs never receive secrets, so skip instead of failing.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
    env:
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the two steps that need the key receive it, so dependency installs can't read it.
      - name: Check API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and review tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.3 pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build prompt
        run: |
          mkdir -p claude-review
          cp .github/claude/review-prompt.md claude-review/prompt.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cat >> claude-review/prompt.md <<EOF

          ## Pull request context
          This run is for PR #${{ github.event.pull_request.number }} (base: \`${{ github.base_ref }}\`).
          Still review the whole project, but also add a "## Changes in this PR" section to report.md.
          Use \`git diff origin/${{ github.base_ref }}...HEAD\` to see what changed, and flag regressions.
          EOF
          fi

      - name: Run Claude evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat claude-review/prompt.md)" \
            --model "$CLAUDE_MODEL" \
            --max-turns 25 \
            --output-format json \
            --allowedTools "Read,Glob,Grep,Write,TodoWrite,Bash(python -m pytest:*),Bash(python -m compileall:*),Bash(ruff check:*),Bash(pip-audit:*),Bash(pip list:*),Bash(pip show:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(ls:*),Bash(wc:*),Bash(mkdir -p claude-review:*)" \
            --disallowedTools "Edit,NotebookEdit,WebFetch,WebSearch" \
            > claude-review/claude-output.json

          jq -r '"Turns: \(.num_turns)  Cost: $\(.total_cost_usd)  Result: \(.result)"' claude-review/claude-output.json || true

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f claude-review/report.md ]; then
            cat claude-review/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Claude did not produce claude-review/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('claude-review/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file claude-review/report.md \
            --edit-last --create-if-none

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-evaluation
          path: |
            claude-review/report.md
            claude-review/verdict.json
            claude-review/claude-output.json
            claude-review/probe_tests/
          if-no-files-found: warn

      # Advisory only: the pass/fail gate is the deterministic `tests` job.
      # An LLM verdict can vary between runs, so it warns instead of failing the build.
      - name: Report verdict (advisory)
        run: |
          f=claude-review/verdict.json
          if ! jq -e . "$f" > /dev/null 2>&1; then
            echo "::warning::Missing or invalid $f"
            exit 0
          fi
          verdict=$(jq -r '.verdict' "$f")
          echo "Verdict: $verdict | Score: $(jq -r '.score' "$f")/10 | Counts: $(jq -c '.counts' "$f")"
          echo "$(jq -r '.summary' "$f")"
          if [ "$verdict" != "pass" ]; then
            echo "::warning::Claude evaluation verdict is '$verdict'. See the job summary or the claude-evaluation artifact."
          fi
