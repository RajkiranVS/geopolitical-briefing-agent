name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "labeled" lets the claude-review label ask for another Claude review
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit, so a moved tag can't change what runs.

jobs:
  # Fast, deterministic checks. No API key needed. They run on every push.
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    if: github.event.action != 'labeled'
    # A new push cancels older tests of the same branch. Reviews have their own group, so a push
    # never cancels a review that is still running.
    concurrency:
      group: tests-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # By default checkout saves the job's token in .git/config, where the code being tested could read it
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile all modules
        run: python -m compileall -q .

      # ruff is pinned in requirements-dev.txt, because ruff.toml uses preview rules that can change between releases.
      - name: Lint
        run: ruff check . --output-format=github

      # Runs even if lint failed, so a lint problem never hides the test results.
      - name: Run pytest
        if: ${{ !cancelled() }}
        run: python -m pytest -v

  # Full-project evaluation by Claude Code in headless (-p) mode.
  claude-evaluation:
    name: Claude project evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each review costs API credit, so it doesn't run on every push to a pull request. It runs when a
    # pull request opens, reopens or leaves draft, when someone adds the claude-review label (remove
    # and re-add it to review again), and on manual dispatch. Draft pull requests aren't reviewed.
    # Fork PRs never receive secrets, so skip instead of failing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review')))
    # Asking for a new review replaces one still running for the same branch
    concurrency:
      group: review-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      # This job's token can write to pull requests. Without this, checkout saves it in .git/config, where
      # the project checks, the probe tests and Claude's Read tool could all reach it. The comment step
      # passes the token itself, and the full history is fetched here, so nothing later needs it saved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only the two steps that need the key receive it, so dependency installs can't read it.
      - name: Check API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install project and review tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pip-audit

      # The project's own code runs here, in a step without the API key. Claude reads the saved output
      # instead of running the test suite itself. The pull request's diff and commits are saved here
      # too, so Claude needs no git commands: git can write files anywhere through --output.
      - name: Run project checks without the API key
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p claude-review/checks
          run_check() {
            name=$1; shift
            "$@" > "claude-review/checks/$name.txt" 2>&1
            echo "exit code: $?" >> "claude-review/checks/$name.txt"
          }
          run_check pytest python -m pytest -v
          run_check compileall python -m compileall -q .
          run_check ruff ruff check .
          run_check pip-audit pip-audit -r requirements.txt
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff "origin/${BASE_REF}...HEAD" > claude-review/checks/diff.txt
            git log --format='%h %s' "origin/${BASE_REF}..HEAD" > claude-review/checks/commits.txt
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.314

      # Values from the event go through environment variables, never straight into the script.
      - name: Build prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p claude-review
          cp .github/claude/review-prompt.md claude-review/prompt.md
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cat >> claude-review/prompt.md <<EOF

          ## Pull request context
          This run is for PR #${PR_NUMBER} (base: \`${BASE_REF}\`).
          Still review the whole project, but also add a "## Changes in this PR" section to report.md.
          Read \`claude-review/checks/diff.txt\` (the output of \`git diff origin/${BASE_REF}...HEAD\`) and
          \`claude-review/checks/commits.txt\` to see what changed, and flag regressions.
          EOF
          fi

      # Claude can write only inside claude-review/ (an Edit rule also covers Write). It can run probe
      # tests with one exact command, so no extra pytest option can write elsewhere, and only through
      # `env -u`, which keeps the key out of their environment. A test written to steal it could still
      # read the parent process, so this only stops accidental exposure.
      - name: Run Claude evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat claude-review/prompt.md)" \
            --model "$CLAUDE_MODEL" \
            --max-turns 25 \
            --output-format json \
            --allowedTools "Read,Glob,Grep,TodoWrite,Edit(claude-review/**),Bash(env -u ANTHROPIC_API_KEY python -m pytest claude-review/probe_tests -v),Bash(mkdir -p claude-review/probe_tests),Bash(pip list:*),Bash(pip show:*),Bash(ls:*),Bash(wc:*)" \
            --disallowedTools "NotebookEdit,WebFetch,WebSearch" \
            > claude-review/claude-output.json

          jq -r '"Turns: \(.num_turns)  Cost: $\(.total_cost_usd)  Result: \(.result)"' claude-review/claude-output.json || true

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f claude-review/report.md ]; then
            cat claude-review/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Claude did not produce claude-review/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('claude-review/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file claude-review/report.md \
            --edit-last --create-if-none

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-evaluation
          path: |
            claude-review/report.md
            claude-review/verdict.json
            claude-review/claude-output.json
            claude-review/probe_tests/
            claude-review/checks/
          if-no-files-found: warn

      # Advisory only: the pass/fail gate is the deterministic `tests` job.
      # An LLM verdict can vary between runs, so it warns instead of failing the build.
      - name: Report verdict (advisory)
        run: |
          f=claude-review/verdict.json
          if ! jq -e . "$f" > /dev/null 2>&1; then
            echo "::warning::Missing or invalid $f"
            exit 0
          fi
          verdict=$(jq -r '.verdict' "$f")
          echo "Verdict: $verdict | Score: $(jq -r '.score' "$f")/10 | Counts: $(jq -c '.counts' "$f")"
          echo "$(jq -r '.summary' "$f")"
          if [ "$verdict" != "pass" ]; then
            echo "::warning::Claude evaluation verdict is '$verdict'. See the job summary or the claude-evaluation artifact."
          fi
